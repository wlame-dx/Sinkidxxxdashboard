<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sinkidxxx Dashboard</title>
    <style>
        body { margin: 0; background-color: #131722; color: #fff; font-family: Arial, sans-serif; }
        .header { display: flex; justify-content: space-between; padding: 10px 20px; background: #1e222d; align-items: center; }
        .main-container { display: flex; height: calc(100vh - 50px); }
        #chart-zone { flex: 3; height: 100%; }
        #panel-zone { flex: 1; background: #1e222d; padding: 15px; border-left: 1px solid #2a2e39; overflow-y: auto; }
        input, select, button { width: 100%; padding: 8px; margin: 5px 0 15px 0; background: #2a2e39; border: none; color: white; border-radius: 4px; }
        button { background: #2962ff; cursor: pointer; font-weight: bold; }
        .alert-item { background: #2a2e39; padding: 10px; margin-bottom: 10px; border-radius: 4px; border-left: 4px solid #00e676; }
    </style>
</head>
<body>

<div class="header">
    <h3 style="margin:0;">SINKIDXXX DASHBOARD</h3>
    <select id="lang-select" onchange="changeLanguage()" style="width: 100px; margin:0;">
        <option value="tr">TR 🇹🇷</option>
        <option value="en">EN 🇬🇧</option>
    </select>
</div>

<div class="main-container">
    <!-- TradingView Chart -->
    <div id="chart-zone"></div>

    <!-- Alarm & Breakout Control Panel -->
    <div id="panel-zone">
        <h4 id="txt-title">🚨 Alarm / Breakout Kur</h4>
        
        <label id="txt-symbol-lbl">Sembol:</label>
        <input type="text" id="alert-symbol" value="NASDAQ:TNON">

        <label id="txt-price-lbl">Hedef Kırılım Fiyatı:</label>
        <input type="number" id="alert-price" placeholder="Örn: 150.50">

        <label id="txt-type-lbl">Kırılım Türü:</label>
        <select id="alert-type">
            <option value="crossing">Yukarı Kırılım (Breakout)</option>
            <option value="support">Destek Kırılımı (Breakdown)</option>
        </select>

        <button id="txt-btn" onclick="addCustomAlert()">Alarmı Ekle</button>

        <hr style="border-color: #2a2e39;">
        <h4 id="txt-list-title">Aktif Alarmlar</h4>
        <div id="alerts-list"></div>
    </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
    let currentLang = "tr";

    // Chart Yükleme
    function initChart(lang) {
        new TradingView.widget({
            "autosize": true,
            "symbol": "NASDAQ:TNON",
            "interval": "D",
            "timezone": "Europe/Istanbul",
            "theme": "dark",
            "style": "1",
            "locale": lang,
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false, // Çizim araç çubuğunu açar
            "container_id": "chart-zone"
        });
    }

    // Dil Değiştirme
    function changeLanguage() {
        currentLang = document.getElementById('lang-select').value;
        initChart(currentLang);

        if (currentLang === "en") {
            document.getElementById('txt-title').innerText = "🚨 Set Alert / Breakout";
            document.getElementById('txt-symbol-lbl').innerText = "Symbol:";
            document.getElementById('txt-price-lbl').innerText = "Target Price:";
            document.getElementById('txt-type-lbl').innerText = "Breakout Type:";
            document.getElementById('txt-btn').innerText = "Add Alert";
            document.getElementById('txt-list-title').innerText = "Active Alerts";
        } else {
            document.getElementById('txt-title').innerText = "🚨 Alarm / Breakout Kur";
            document.getElementById('txt-symbol-lbl').innerText = "Sembol:";
            document.getElementById('txt-price-lbl').innerText = "Hedef Kırılım Fiyatı:";
            document.getElementById('txt-type-lbl').innerText = "Kırılım Türü:";
            document.getElementById('txt-btn').innerText = "Alarmı Ekle";
            document.getElementById('txt-list-title').innerText = "Aktif Alarmlar";
        }
    }

    // Arayüzde Alarm Listeleme
    function addCustomAlert() {
        const sym = document.getElementById('alert-symbol').value;
        const price = document.getElementById('alert-price').value;
        const type = document.getElementById('alert-type').value;

        if (!price) return;

        const list = document.getElementById('alerts-list');
        const item = document.createElement('div');
        item.className = 'alert-item';
        item.innerHTML = `<strong>${sym}</strong> - ${price} (${type}) <br><small>Takip Ediliyor...</small>`;
        list.appendChild(item);
    }

    // Sayfa yüklenince başlat
    initChart('tr');
</script>
</body>
</html>
