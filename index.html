<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINKIDXXX // PRO TERMINAL</title>
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #12141a; color: #a1a7b6; height: 100vh; overflow: hidden; font-size: 12px; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; background: #1a1d26; border-bottom: 1px solid #282c3a; padding: 0 14px; height: 42px; }
        .logo { font-weight: 800; color: #fff; font-size: 15px; letter-spacing: 1px; }
        .nav-right { display: flex; gap: 10px; align-items: center; }
        
        .grid-container { display: grid; grid-template-columns: 260px 1fr 300px; height: calc(100vh - 42px); }
        
        /* Left Watchlist */
        .sidebar-left { background: #161821; border-right: 1px solid #242836; overflow-y: auto; }
        .section-title { padding: 10px 14px; font-weight: 700; color: #646b7c; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #1f222e; display: flex; justify-content: space-between; }
        .watchlist-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #1c1f2b; cursor: pointer; transition: 0.1s; }
        .watchlist-item:hover, .watchlist-item.active { background: #1d202c; }
        .sym-name { font-weight: 700; color: #e1e4ea; font-size: 13px; }
        .btn-delete-sym { background: rgba(255, 82, 82, 0.2); color: #ff5252; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 10px; display: none; }
        .btn-delete-sym:hover { background: #ff5252; color: #fff; }

        /* Main Chart Area */
        .main-chart-area { display: flex; flex-direction: column; background: #12141a; position: relative; height: 100%; }
        #tradingview_widget { width: 100%; height: 100%; }

        /* Right Panel */
        .sidebar-right { background: #161821; border-left: 1px solid #242836; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .panel-box { background: #1c1f2b; border: 1px solid #262a3b; border-radius: 6px; padding: 12px; }
        .panel-box h4 { color: #fff; font-size: 13px; margin-bottom: 8px; }
        
        .admin-box { border-color: #2962ff; background: rgba(41, 98, 255, 0.05); }

        input, select, button { width: 100%; background: #242836; border: 1px solid #303548; color: #fff; padding: 8px; border-radius: 4px; margin-top: 4px; font-size: 12px; }
        button.btn-action { background: #2962ff; border: none; font-weight: bold; cursor: pointer; }
        button.btn-action:hover { background: #1e51e6; }
        button.btn-danger { background: #ff5252; border: none; font-weight: bold; cursor: pointer; }
        .user-badge { background: #222634; padding: 4px 8px; border-radius: 4px; color: #00e676; font-weight: bold; }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="logo">SINKIDXXX // TERMINAL PRO</div>
    <div class="nav-right">
        <select id="lang-select" onchange="manualLanguageSwitch()" style="width: auto; padding: 2px 6px;">
            <option value="tr">TR 🇹🇷</option>
            <option value="en">EN 🇬🇧</option>
        </select>
        <div id="auth-status-area">
            <button onclick="openLoginModal(false)" style="width:auto; padding: 4px 10px;" id="btn-login-modal">Giriş Yap</button>
        </div>
    </div>
</div>

<div class="grid-container">
    <div class="sidebar-left">
        <div class="section-title">
            <span id="txt-watchlist-title">İzleme Listem</span>
            <span style="color:#2962ff;">LIVE CLOUD</span>
        </div>
        <div id="watchlist-container"></div>
    </div>

    <div class="main-chart-area">
        <div id="tradingview_widget"></div>
    </div>

    <div class="sidebar-right">
        <div class="panel-box admin-box" id="admin-panel" style="display: none;">
            <h4 style="color: #2962ff;">⚡ Admin Kontrol Paneli</h4>
            <p style="font-size:10px; color:#828a9e; margin-bottom:6px;" id="txt-admin-info">Tüm kullanıcılara canlı sembol ekleyin:</p>
            <input type="text" id="admin-new-symbol" placeholder="Örn: BINANCE:BTCUSDT veya BIST:THYAO">
            <button class="btn-action" onclick="adminAddSymbol()" style="margin-top:6px;" id="btn-add-coin">Listeye Ekle</button>
        </div>

        <div class="panel-box">
            <h4 id="txt-risk-title">Risk Yönetimi</h4>
            <label style="font-size:11px;">Stop Loss:</label>
            <input type="number" id="input-stop-loss" placeholder="Stop Loss">
            <label style="font-size:11px; margin-top:6px; display:block;">Take Profit:</label>
            <input type="number" id="input-take-profit" placeholder="Take Profit">
        </div>
    </div>
</div>

<!-- GİRİŞ MODALI -->
<div id="login-modal" style="display:flex; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.92); z-index:9999; justify-content:center; align-items:center; backdrop-filter: blur(5px);">
    <div class="panel-box" style="width: 320px; background: #161821; border: 1px solid #303548; box-shadow: 0 8px 24px rgba(0,0,0,0.5);">
        <h4 id="txt-login-header" style="text-align:center; font-size:16px; margin-bottom:12px;">Sisteme Giriş Yap</h4>
        <div style="font-size:11px; color:#828a9e; margin-bottom:12px; background:#111319; padding:8px; border-radius:4px; line-height:1.4;">
            <div>Demo User: <strong style="color:#fff;">t.me/sinkidxxx</strong></div>
            <div>Şifre: <strong style="color:#fff;">sinkidxxx</strong></div>
        </div>
        <input type="text" id="login-user" placeholder="Kullanıcı Adı">
        <input type="password" id="login-pass" placeholder="Şifre">
        <button class="btn-action" onclick="handleLogin()" style="margin-top:12px; padding:10px;" id="btn-submit-login">Giriş Yap</button>
        <button onclick="closeLoginModal()" id="btn-close-modal" style="display:none; background:transparent; border:none; color:#828a9e; margin-top:8px; cursor:pointer;">Kapat</button>
    </div>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
    // --- FIREBASE KURULUMU ---
    // ⚠️ AŞAĞIDAKİ databaseURL ALANINA KENDİ FIREBASE URL'İNİZİ YAPIŞTIRIN
    const firebaseConfig = {
        databaseURL: "https://sinkidxxx-cbd86-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const watchlistRef = db.ref('global_watchlist');

    let currentSymbol = 'BINANCE:BTCUSDT';
    let currentLang = 'tr';
    let currentUser = null; 
    let tvWidget = null;
    let watchListSymbols = [];

    // Firebase'den Canlı Liste Takibi (Sitedeki Herkese Anında Yansır)
    watchlistRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            watchListSymbols = Object.values(data);
        } else {
            // İlk açılış varsayılan liste
            watchListSymbols = ['BINANCE:BTCUSDT', 'BINANCE:ETHUSDT', 'BINANCE:SOLUSDT', 'BIST:THYAO'];
            watchlistRef.set(watchListSymbols);
        }
        renderWatchlist();
    });

    function detectLanguage() {
        const userLang = navigator.language || navigator.userLanguage; 
        currentLang = userLang.startsWith('tr') ? 'tr' : 'en';
        document.getElementById('lang-select').value = currentLang;
        applyLanguageStrings();
    }

    function manualLanguageSwitch() {
        currentLang = document.getElementById('lang-select').value;
        applyLanguageStrings();
        loadTradingViewChart(currentSymbol);
    }

    function applyLanguageStrings() {
        const t = {
            tr: { watchlist: "İzleme Listem", login: "Giriş Yap", adminInfo: "Tüm kullanıcılara canlı sembol ekleyin:", addCoin: "Listeye Ekle", riskTitle: "Risk Yönetimi", loginHeader: "Sisteme Giriş Yap", close: "Kapat" },
            en: { watchlist: "Watchlist", login: "Log In", adminInfo: "Add symbol to global watchlist:", addCoin: "Add Symbol", riskTitle: "Risk Management", loginHeader: "System Login", close: "Close" }
        }[currentLang];

        document.getElementById('txt-watchlist-title').innerText = t.watchlist;
        if(!currentUser) {
            document.getElementById('auth-status-area').innerHTML = `<button onclick="openLoginModal(false)" style="width:auto; padding: 4px 10px;" id="btn-login-modal">${t.login}</button>`;
        }
        document.getElementById('txt-admin-info').innerText = t.adminInfo;
        document.getElementById('btn-add-coin').innerText = t.addCoin;
        document.getElementById('txt-risk-title').innerText = t.riskTitle;
        document.getElementById('txt-login-header').innerText = t.loginHeader;
        document.getElementById('btn-submit-login').innerText = t.login;
        document.getElementById('btn-close-modal').innerText = t.close;
    }

    function openLoginModal(isMandatory = false) { 
        document.getElementById('login-modal').style.display = 'flex';
        document.getElementById('btn-close-modal').style.display = isMandatory ? 'none' : 'block';
    }

    function closeLoginModal() { 
        if(!currentUser) {
            alert(currentLang === 'tr' ? "Devam etmek için giriş yapmalısınız." : "You must login to continue.");
            return;
        }
        document.getElementById('login-modal').style.display = 'none'; 
    }

    function handleLogin() {
        const u = document.getElementById('login-user').value.trim();
        const p = document.getElementById('login-pass').value.trim();

        if(u === 'itsswlame' && p === '102546Kb') {
            currentUser = { username: 'itsswlame', role: 'admin' };
            document.getElementById('admin-panel').style.display = 'block';
            updateAuthBar();
            document.getElementById('login-modal').style.display = 'none';
            renderWatchlist();
        } else if(u === 't.me/sinkidxxx' && p === 'sinkidxxx') {
            currentUser = { username: 't.me/sinkidxxx', role: 'user' };
            document.getElementById('admin-panel').style.display = 'none';
            updateAuthBar();
            document.getElementById('login-modal').style.display = 'none';
            renderWatchlist();
        } else {
            alert(currentLang === 'tr' ? "Hatalı kullanıcı adı veya şifre!" : "Invalid credentials!");
        }
    }

    function handleLogout() {
        currentUser = null;
        document.getElementById('admin-panel').style.display = 'none';
        updateAuthBar();
        renderWatchlist();
        openLoginModal(true);
    }

    function updateAuthBar() {
        const area = document.getElementById('auth-status-area');
        if(currentUser) {
            const roleTag = currentUser.role === 'admin' ? '<span style="color:#2962ff;">[ADMIN]</span>' : '';
            area.innerHTML = `
                <span class="user-badge">👤 ${currentUser.username} ${roleTag}</span>
                <button class="btn-danger" onclick="handleLogout()" style="width:auto; padding: 4px 8px; margin-left:6px;">${currentLang === 'tr' ? 'Çıkış' : 'Logout'}</button>
            `;
        } else {
            area.innerHTML = `<button onclick="openLoginModal(false)" style="width:auto; padding: 4px 10px;">${currentLang === 'tr' ? 'Giriş Yap' : 'Log In'}</button>`;
        }
    }

    // Admin Tarafından Buluta Symbol Ekleme
    function adminAddSymbol() {
        let sym = document.getElementById('admin-new-symbol').value.toUpperCase().trim();
        if(sym) {
            if(!sym.includes(':')) sym = 'BINANCE:' + sym;
            if(!watchListSymbols.includes(sym)) {
                watchListSymbols.push(sym);
                watchlistRef.set(watchListSymbols); // Firebase Veritabanını Günceller
                document.getElementById('admin-new-symbol').value = '';
            }
        }
    }

    // Admin Tarafından Buluttan Symbol Silme
    function removeSymbol(event, sym) {
        event.stopPropagation();
        watchListSymbols = watchListSymbols.filter(s => s !== sym);
        watchlistRef.set(watchListSymbols); // Firebase Veritabanını Günceller
    }

    function renderWatchlist() {
        const container = document.getElementById('watchlist-container');
        container.innerHTML = '';
        
        watchListSymbols.forEach(s => {
            const item = document.createElement('div');
            item.className = `watchlist-item ${s === currentSymbol ? 'active' : ''}`;
            item.onclick = () => switchSymbol(s);
            
            const isDeleteVisible = currentUser && currentUser.role === 'admin' ? 'inline-block' : 'none';
            
            item.innerHTML = `
                <div>
                    <div class="sym-name">${s}</div>
                </div>
                <button class="btn-delete-sym" style="display:${isDeleteVisible};" onclick="removeSymbol(event, '${s}')">Kaldır</button>
            `;
            container.appendChild(item);
        });
    }

    function loadTradingViewChart(symbol) {
        document.getElementById('tradingview_widget').innerHTML = '';
        
        tvWidget = new TradingView.widget({
            "autosize": true,
            "symbol": symbol,
            "interval": "D",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": currentLang,
            "toolbar_bg": "#12141a",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_widget"
        });
    }

    function switchSymbol(symbol) {
        currentSymbol = symbol;
        renderWatchlist();
        loadTradingViewChart(symbol);
    }

    detectLanguage();
    loadTradingViewChart(currentSymbol);

    if(!currentUser) {
        openLoginModal(true);
    }
</script>
</body>
</html>
