<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINKIDXXX // PRO TERMINAL</title>
    <!-- Lightweight Charts V4 -->
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #12141a; color: #a1a7b6; height: 100vh; overflow: hidden; font-size: 12px; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; background: #1a1d26; border-bottom: 1px solid #282c3a; padding: 0 14px; height: 42px; }
        .logo { font-weight: 800; color: #fff; font-size: 15px; letter-spacing: 1px; }
        .nav-right { display: flex; gap: 10px; align-items: center; }
        
        .grid-container { display: grid; grid-template-columns: 240px 1fr 320px; height: calc(100vh - 42px); }
        
        /* Left Watchlist */
        .sidebar-left { background: #161821; border-right: 1px solid #242836; overflow-y: auto; }
        .section-title { padding: 10px 14px; font-weight: 700; color: #646b7c; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #1f222e; display: flex; justify-content: space-between; }
        .watchlist-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #1c1f2b; cursor: pointer; transition: 0.1s; }
        .watchlist-item:hover, .watchlist-item.active { background: #1d202c; }
        .sym-name { font-weight: 700; color: #e1e4ea; font-size: 13px; }
        .price-badge { padding: 3px 6px; border-radius: 4px; font-weight: 700; font-size: 11px; text-align: right; }
        .green-bg { background: rgba(0, 230, 118, 0.15); color: #00e676; }

        /* Main Chart Area */
        .main-chart-area { display: flex; flex-direction: column; background: #12141a; position: relative; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #161821; border-bottom: 1px solid #242836; }
        .current-symbol { font-size: 18px; font-weight: 800; color: #fff; display: flex; align-items: baseline; gap: 8px; }
        .current-price { font-size: 16px; color: #00e676; }
        
        #chart-canvas { flex: 1; width: 100%; height: 100%; }

        /* Right Panel */
        .sidebar-right { background: #161821; border-left: 1px solid #242836; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .panel-box { background: #1c1f2b; border: 1px solid #262a3b; border-radius: 6px; padding: 12px; }
        .panel-box h4 { color: #fff; font-size: 13px; margin-bottom: 8px; }
        
        .admin-box { border-color: #2962ff; background: rgba(41, 98, 255, 0.05); }

        input, select, button { width: 100%; background: #242836; border: 1px solid #303548; color: #fff; padding: 8px; border-radius: 4px; margin-top: 4px; font-size: 12px; }
        button.btn-action { background: #2962ff; border: none; font-weight: bold; cursor: pointer; }
        button.btn-action:hover { background: #1e51e6; }
        button.btn-danger { background: #ff5252; border: none; font-weight: bold; cursor: pointer; }
        .user-badge { background: #222634; padding: 4px 8px; border-radius: 4px; color: #00e676; font-weight: bold; }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="logo">SINKIDXXX // TERMINAL PRO</div>
    <div class="nav-right">
        <select id="lang-select" onchange="manualLanguageSwitch()" style="width: auto; padding: 2px 6px;">
            <option value="tr">TR 🇹🇷</option>
            <option value="en">EN 🇬🇧</option>
        </select>
        <div id="auth-status-area">
            <button onclick="openLoginModal()" style="width:auto; padding: 4px 10px;" id="btn-login-modal">Giriş Yap</button>
        </div>
    </div>
</div>

<div class="grid-container">
    <!-- SOL İZLEME LİSTESİ -->
    <div class="sidebar-left">
        <div class="section-title">
            <span id="txt-watchlist-title">İzleme Listem</span>
            <span style="color:#2962ff;">LIVE</span>
        </div>
        <div id="watchlist-container"></div>
    </div>

    <!-- ORTA CANLI GRAFİK -->
    <div class="main-chart-area">
        <div class="chart-header">
            <div class="current-symbol">
                <span id="active-sym">BTCUSDT</span>
                <span class="current-price" id="active-price">Loading...</span>
            </div>
            <div style="color: #646b7c; font-weight: bold;">BINANCE REALTIME</div>
        </div>
        <div id="chart-canvas"></div>
    </div>

    <!-- SAĞ ALARM & ADMIN PANELİ -->
    <div class="sidebar-right">
        <!-- Admin Kontrol Alanı -->
        <div class="panel-box admin-box" id="admin-panel" style="display: none;">
            <h4 style="color: #2962ff;">⚡ Admin Kontrol Paneli</h4>
            <p style="font-size:10px; color:#828a9e; margin-bottom:6px;" id="txt-admin-info">Kullanıcıların izleme listesine coin ekleyin:</p>
            <input type="text" id="admin-new-symbol" placeholder="Örn: SOLUSDT veya XRPUSDT">
            <button class="btn-action" onclick="adminAddSymbol()" style="margin-top:6px;" id="btn-add-coin">Listeye Ekle</button>
        </div>

        <div class="panel-box">
            <h4 id="txt-alert-box-title">🎯 Kırılım Seviyesi Seçici</h4>
            <label style="font-size:11px;" id="lbl-target-price">Hedef Kırılım Fiyatı:</label>
            <input type="number" id="input-alert-level" placeholder="Örn: 68000" onchange="drawPriceLine()">
            <button class="btn-action" onclick="drawPriceLine()" style="margin-top:8px;" id="btn-draw-line">Çizgiyi Grafiğe Çiz</button>
        </div>

        <div class="panel-box">
            <h4 id="txt-risk-title">Risk Yönetimi</h4>
            <label style="font-size:11px;">Stop Loss:</label>
            <input type="number" id="input-stop-loss" placeholder="Stop Loss">
            <label style="font-size:11px; margin-top:6px; display:block;">Take Profit:</label>
            <input type="number" id="input-take-profit" placeholder="Take Profit">
        </div>
    </div>
</div>

<!-- GİRİŞ MODALI -->
<div id="login-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); z-index:999; justify-content:center; align-items:center;">
    <div class="panel-box" style="width: 320px; background: #161821;">
        <h4 id="txt-login-header">Sisteme Giriş Yap</h4>
        <div style="font-size:10px; color:#828a9e; margin-bottom:8px;">
            Demo User: <strong>t.me/sinkidxxx</strong> / <strong>sinkidxxx</strong>
        </div>
        <input type="text" id="login-user" placeholder="Kullanıcı Adı">
        <input type="password" id="login-pass" placeholder="Şifre">
        <button class="btn-action" onclick="handleLogin()" style="margin-top:10px;" id="btn-submit-login">Giriş Yap</button>
        <button onclick="closeLoginModal()" style="background:transparent; border:none; color:#828a9e; margin-top:5px; cursor:pointer;" id="btn-close-modal">Kapat</button>
    </div>
</div>

<script>
    let chart, candleSeries, priceLine = null;
    let currentSymbol = 'BTCUSDT';
    let wsConnection = null;
    let currentLang = 'tr';
    let currentUser = null; 

    let watchListSymbols = ['BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'SOLUSDT'];

    function detectLanguage() {
        const userLang = navigator.language || navigator.userLanguage; 
        currentLang = userLang.startsWith('tr') ? 'tr' : 'en';
        document.getElementById('lang-select').value = currentLang;
        applyLanguageStrings();
    }

    function manualLanguageSwitch() {
        currentLang = document.getElementById('lang-select').value;
        applyLanguageStrings();
    }

    function applyLanguageStrings() {
        const t = {
            tr: {
                watchlist: "İzleme Listem",
                login: "Giriş Yap",
                logout: "Çıkış Yap",
                adminTitle: "⚡ Admin Kontrol Paneli",
                adminInfo: "Kullanıcıların izleme listesine coin ekleyin:",
                addCoin: "Listeye Ekle",
                alertTitle: "🎯 Kırılım Seviyesi Seçici",
                targetPrice: "Hedef Kırılım Fiyatı:",
                drawLine: "Çizgiyi Grafiğe Çiz",
                riskTitle: "Risk Yönetimi",
                loginHeader: "Sisteme Giriş Yap",
                close: "Kapat"
            },
            en: {
                watchlist: "Watchlist",
                login: "Log In",
                logout: "Log Out",
                adminTitle: "⚡ Admin Control Panel",
                adminInfo: "Add symbols to users' watchlist:",
                addCoin: "Add to Watchlist",
                alertTitle: "🎯 Breakout Level Selector",
                targetPrice: "Target Breakout Price:",
                drawLine: "Draw Line on Chart",
                riskTitle: "Risk Management",
                loginHeader: "System Login",
                close: "Close"
            }
        }[currentLang];

        document.getElementById('txt-watchlist-title').innerText = t.watchlist;
        if(!currentUser) {
            document.getElementById('auth-status-area').innerHTML = `<button onclick="openLoginModal()" style="width:auto; padding: 4px 10px;" id="btn-login-modal">${t.login}</button>`;
        }
        document.getElementById('txt-admin-info').innerText = t.adminInfo;
        document.getElementById('btn-add-coin').innerText = t.addCoin;
        document.getElementById('txt-alert-box-title').innerText = t.alertTitle;
        document.getElementById('lbl-target-price').innerText = t.targetPrice;
        document.getElementById('btn-draw-line').innerText = t.drawLine;
        document.getElementById('txt-risk-title').innerText = t.riskTitle;
        document.getElementById('txt-login-header').innerText = t.loginHeader;
        document.getElementById('btn-submit-login').innerText = t.login;
        document.getElementById('btn-close-modal').innerText = t.close;
    }

    function openLoginModal() {
        document.getElementById('login-modal').style.display = 'flex';
    }

    function closeLoginModal() {
        document.getElementById('login-modal').style.display = 'none';
    }

    function handleLogin() {
        const u = document.getElementById('login-user').value.trim();
        const p = document.getElementById('login-pass').value.trim();

        if(u === 'itsswlame' && p === '102546Kb') {
            currentUser = { username: 'itsswlame', role: 'admin' };
            document.getElementById('admin-panel').style.display = 'block';
            updateAuthBar();
            closeLoginModal();
        } else if(u === 't.me/sinkidxxx' && p === 'sinkidxxx') {
            currentUser = { username: 't.me/sinkidxxx', role: 'user' };
            document.getElementById('admin-panel').style.display = 'none';
            updateAuthBar();
            closeLoginModal();
        } else {
            alert(currentLang === 'tr' ? "Hatalı kullanıcı adı veya şifre!" : "Invalid credentials!");
        }
    }

    function handleLogout() {
        currentUser = null;
        document.getElementById('admin-panel').style.display = 'none';
        updateAuthBar();
    }

    function updateAuthBar() {
        const area = document.getElementById('auth-status-area');
        if(currentUser) {
            const roleTag = currentUser.role === 'admin' ? '<span style="color:#2962ff;">[ADMIN]</span>' : '';
            area.innerHTML = `
                <span class="user-badge">👤 ${currentUser.username} ${roleTag}</span>
                <button class="btn-danger" onclick="handleLogout()" style="width:auto; padding: 4px 8px; margin-left:6px;">${currentLang === 'tr' ? 'Çıkış' : 'Logout'}</button>
            `;
        } else {
            area.innerHTML = `<button onclick="openLoginModal()" style="width:auto; padding: 4px 10px;">${currentLang === 'tr' ? 'Giriş Yap' : 'Log In'}</button>`;
        }
    }

    function adminAddSymbol() {
        const sym = document.getElementById('admin-new-symbol').value.toUpperCase().trim();
        if(sym && !watchListSymbols.includes(sym)) {
            watchListSymbols.push(sym);
            renderWatchlist();
            document.getElementById('admin-new-symbol').value = '';
        }
    }

    function renderWatchlist() {
        const container = document.getElementById('watchlist-container');
        container.innerHTML = '';
        
        watchListSymbols.forEach(s => {
            const item = document.createElement('div');
            item.className = `watchlist-item ${s === currentSymbol ? 'active' : ''}`;
            item.onclick = () => switchSymbol(s);
            item.innerHTML = `
                <div>
                    <div class="sym-name">${s}</div>
                    <div style="font-size:10px; color:#5a6070;">Binance Spot</div>
                </div>
                <div class="price-badge green-bg">LIVE</div>
            `;
            container.appendChild(item);
        });
    }

    function initChartEngine() {
        const container = document.getElementById('chart-canvas');
        chart = LightweightCharts.createChart(container, {
            autoSize: true,
            layout: { background: { type: 'solid', color: '#12141a' }, textColor: '#7e8392' },
            grid: { vertLines: { color: '#1c1f2b' }, horzLines: { color: '#1c1f2b' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            priceScale: { borderColor: '#242836' },
            timeScale: { borderColor: '#242836', timeVisible: true },
        });

        candleSeries = chart.addCandlestickSeries({
            upColor: '#00e676', downColor: '#ff5252',
            borderUpColor: '#00e676', borderDownColor: '#ff5252',
            wickUpColor: '#00e676', wickDownColor: '#ff5252',
        });

        loadRealCandleData(currentSymbol);
    }

    async function loadRealCandleData(symbol) {
        if(wsConnection) wsConnection.close();

        document.getElementById('active-sym').innerText = symbol;
        document.getElementById('active-price').innerText = 'Loading...';

        try {
            const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1m&limit=100`);
            const data = await res.json();
            
            const formattedCandles = data.map(d => ({
                time: d[0] / 1000,
                open: parseFloat(d[1]),
                high: parseFloat(d[2]),
                low: parseFloat(d[3]),
                close: parseFloat(d[4])
            }));

            candleSeries.setData(formattedCandles);
            
            const lastPrice = formattedCandles[formattedCandles.length - 1].close;
            document.getElementById('active-price').innerText = lastPrice + ' USD';

            connectBinanceWebSocket(symbol);

        } catch (e) {
            console.error("Veri hatası:", e);
        }
    }

    function connectBinanceWebSocket(symbol) {
        const streamName = symbol.toLowerCase() + '@kline_1m';
        wsConnection = new WebSocket(`wss://stream.binance.com:9443/ws/${streamName}`);

        wsConnection.onmessage = (event) => {
            const message = JSON.parse(event.data);
            const kline = message.k;
            
            const updatedCandle = {
                time: kline.t / 1000,
                open: parseFloat(kline.o),
                high: parseFloat(kline.h),
                low: parseFloat(kline.l),
                close: parseFloat(kline.c)
            };

            candleSeries.update(updatedCandle);
            document.getElementById('active-price').innerText = updatedCandle.close + ' USD';
        };
    }

    function switchSymbol(symbol) {
        currentSymbol = symbol;
        renderWatchlist();
        loadRealCandleData(symbol);
    }

    function drawPriceLine() {
        const val = parseFloat(document.getElementById('input-alert-level').value);
        if(!val) return;

        if (priceLine) candleSeries.removePriceLine(priceLine);

        priceLine = candleSeries.createPriceLine({
            price: val,
            color: '#ff5252',
            lineWidth: 2,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: 'KIRILIM: ' + val,
        });
    }

    detectLanguage();
    renderWatchlist();
    initChartEngine();
</script>
</body>
</html>
