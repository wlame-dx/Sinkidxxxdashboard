<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sinkidxxx</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0e12; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; height: 100vh; overflow: hidden; }

        /* LOGIN PAGE */
        #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: radial-gradient(circle at center, #1a1d26 0%, #0d0e12 100%); }
        .login-card { background: #131722; border: 1px solid #2a2e39; border-radius: 16px; padding: 40px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .logo-circle { width: 60px; height: 60px; border-radius: 50%; border: 2px dashed #2962ff; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: #fff; font-weight: bold; font-size: 20px; }
        .login-card h2 { font-size: 22px; color: #fff; margin-bottom: 8px; }
        .login-card p { font-size: 13px; color: #787b86; margin-bottom: 24px; }
        .input-field { width: 100%; padding: 12px 16px; background: #1e222d; border: 1px solid #2a2e39; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 16px; outline: none; }
        .input-field:focus { border-color: #2962ff; }
        .login-btn { width: 100%; padding: 12px; background: #ffffff; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .login-btn:hover { background: #e0e0e0; }
        .error-msg { color: #f23645; font-size: 12px; margin-bottom: 12px; display: none; }

        /* DASHBOARD */
        #dashboard-screen { display: none; height: 100vh; flex-direction: column; }
        header { height: 50px; background: #131722; border-bottom: 1px solid #2a2e39; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .brand { font-weight: bold; color: #2962ff; font-size: 18px; letter-spacing: 1px; }
        .user-info { font-size: 12px; color: #787b86; }
        .main-content { display: flex; flex: 1; height: calc(100vh - 50px); }
        #chart-zone { flex: 3; height: 100%; border-right: 1px solid #2a2e39; }
        #panel-zone { flex: 1; min-width: 320px; background: #131722; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .panel-title { color: #fff; font-size: 15px; border-bottom: 1px solid #2a2e39; padding-bottom: 8px; }
        .box { background: #1e222d; padding: 12px; border-radius: 6px; border: 1px solid #2a2e39; }
        .box label { font-size: 11px; color: #787b86; display: block; margin-bottom: 4px; }
        .box input { width: 100%; background: transparent; border: none; color: #fff; font-size: 14px; outline: none; }
        .feed-card { background: #1e222d; border-left: 4px solid #089981; padding: 10px; border-radius: 4px; font-size: 12px; margin-top: 8px; }

        @media (max-width: 768px) {
            .main-content { flex-direction: column; }
            #chart-zone { height: 60%; }
            #panel-zone { height: 40%; min-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- LOGIN PANELİ -->
    <div id="login-screen">
        <div class="login-card">
            <div class="logo-circle">S</div>
            <h2>Panelinize dönün</h2>
            <p>Telegram kullanıcı adınız ve parolanızla giriş yapın.</p>
            <div id="error" class="error-msg">Hatalı kullanıcı adı veya şifre!</div>
            <input type="text" id="username" class="input-field" placeholder="Telegram kullanıcı adınız">
            <input type="password" id="password" class="input-field" placeholder="Parola">
            <button class="login-btn" onclick="login()">Giriş yap &rarr;</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD (SINKIDXXX) -->
    <div id="dashboard-screen">
        <header>
            <div class="brand">sinkidxxx</div>
            <div class="user-info">Giriş Yapıldı: <b>t.me/sinkidxxx</b></div>
        </header>
        <div class="main-content">
            <!-- Sol: Reel TradingView Grafiği -->
            <div id="chart-zone">
                <div class="tradingview-widget-container" style="height:100%;width:100%">
                  <div id="tradingview_chart" style="height:100%;width:100%"></div>
                  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                  <script type="text/javascript">
                  function loadChart() {
                      new TradingView.widget({
                        "autosize": true,
                        "symbol": "NASDAQ:TNON",
                        "interval": "D",
                        "timezone": "Europe/Istanbul",
                        "theme": "dark",
                        "style": "1",
                        "locale": "tr",
                        "toolbar_bg": "#f1f3f6",
                        "enable_publishing": false,
                        "container_id": "tradingview_chart"
                      });
                  }
                  </script>
                </div>
            </div>

            <!-- Sağ: Emir & Alarm Sağ Paneli -->
            <div id="panel-zone">
                <div class="panel-title">Kırılım Noktası & Alarmlar</div>
                <div class="box">
                    <label>KIRILIM NOKTASI</label>
                    <input type="text" value="8.50 USD" readonly>
                </div>
                <div class="box">
                    <label>STOP LOSS</label>
                    <input type="text" value="8.20">
                </div>
                <div class="box">
                    <label>TAKE PROFIT</label>
                    <input type="text" value="8.70 / 9.00">
                </div>
                
                <div class="panel-title" style="margin-top: 15px;">Canlı Alarm Akışı</div>
                <div id="feed">
                    <div class="feed-card">
                        <b>TNON</b> - Direnç Kırılımı Tetiklendi!<br>
                        <small style="color:#787b86;">Canlı Veri: 8.50 USD</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const error = document.getElementById('error');

            if (user === "t.me/sinkidxxx" && pass === "sinkidxxx") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'flex';
                loadChart();
            } else {
                error.style.display = 'block';
            }
        }
    </script>
</body>
</html>
